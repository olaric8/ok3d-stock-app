# ---------------------------------------------------------------------------
# Streamlit configuration for the OK3D Stock App.
#
# WHY headless = true MATTERS
# ---------------------------
# `server.headless = false` tells Streamlit to try opening a browser window.
# Streamlit Cloud runs in a headless container with no display, and in that
# state Streamlit ALSO shows the first-run "enter your email" prompt, which
# blocks waiting for input. The server then never binds to port 8501, the
# platform's health check fails with "connection refused", and the app is
# reported as errored before a single line of app.py runs.
#
# `headless = true` is the documented setting for managed/container hosting:
# it starts the server without a browser and suppresses the email prompt.
# `showEmailPrompt = false` states the same intent explicitly.
# ---------------------------------------------------------------------------

[server]
headless = true
showEmailPrompt = false

# Serves ./static/ under app/static/, so the brand artwork is fetched once and
# cached by the browser rather than being inlined into every rerun's HTML as
# base64. Streamlit reruns on every widget interaction, so inlining a 165 KB
# image would re-send it on each tap.
enableStaticServing = true

[browser]
# No usage statistics from a shop's own deployment.
gatherUsageStats = false

# ---------------------------------------------------------------------------
# BRAND
#
# Sampled from the OK3D logo: navy #002870 (the "OK" and "D"), green #60A008
# (the "3"), water blue #1868C8 (the splash inside the O).
#
# THE GREEN HERE IS NOT THE LOGO'S GREEN. #60A008 scores a contrast ratio of only
# 3.22 against white -- below the 4.5 required for body text -- so white text on
# a green button would be washed out and hard to read. #4C7E06 is the same hue
# darkened, scoring 4.89. The bright green survives in the logo and the app icon,
# where it is large and decorative and contrast rules are looser.
#
# Do not "correct" #4C7E06 back to #60A008.
# ---------------------------------------------------------------------------

[theme]
primaryColor = "#002870"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F4F7FC"
textColor = "#0B1B33"

# Native theme options, so they apply consistently to every widget instead of
# being bolted on with CSS that breaks whenever Streamlit's DOM changes.
# Option names verified against the 52 theme options this build registers --
# a wrong name is silently ignored and logs a startup warning.
baseRadius = "large"
buttonRadius = "large"
borderColor = "#D8E0EE"
showWidgetBorder = true
showSidebarBorder = true
linkColor = "#0047A3"
linkUnderline = false
codeBackgroundColor = "#F4F7FC"

# Softer, more current type. The stack degrades gracefully if a face is absent,
# so nothing is downloaded and the app keeps working offline.
font = "Inter, Segoe UI, system-ui, -apple-system, sans-serif"
headingFont = "Inter, Segoe UI, system-ui, -apple-system, sans-serif"
codeFont = "JetBrains Mono, Consolas, monospace"
baseFontSize = 16
baseFontWeight = 400
codeFontSize = "0.85rem"

# Larger values suit a dashboard read at arm's length on a shop tablet.
metricValueFontSize = "2.1rem"
metricValueFontWeight = 700
headingFontSizes = { h1 = "2.1rem", h2 = "1.5rem", h3 = "1.2rem" }
headingFontWeights = { h1 = 700, h2 = 700, h3 = 700 }

# Status palette. Red and amber are SEMANTIC and deliberately not brand colours:
# a reorder alert must stay red even though red is not in the logo.
redColor = "#C62828"
redBackgroundColor = "#FDECEC"
redTextColor = "#A31F1F"
greenColor = "#4C7E06"
greenBackgroundColor = "#F1F7E6"
greenTextColor = "#3F6A05"
orangeColor = "#E17055"
orangeBackgroundColor = "#FDF0EC"
orangeTextColor = "#B34A31"
yellowColor = "#F1C40F"
yellowBackgroundColor = "#FEF9E7"
yellowTextColor = "#8A6D0B"
grayColor = "#7F8C8D"

# Sidebar tinted to the brand navy family. NOTE: [theme.sidebar] does not inherit
# every top-level theme key, so values are repeated here rather than assumed.
[theme.sidebar]
backgroundColor = "#F7F9FD"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#0B1B33"
borderColor = "#D8E0EE"
primaryColor = "#002870"

# ---------------------------------------------------------------------------
# OK3D application settings
#
# Streamlit ignores unknown sections, so this is a safe home for our own
# configuration -- and unlike the Secrets editor, this file is edited locally
# and delivered by git, so no paste path can mangle it.
#
# spreadsheet_id is a POINTER, not a credential: it is already public in this
# repository. All data access still requires the service-account key, which
# lives only in the Streamlit secrets store and is never committed.
#
# Resolution order for the target workbook:
#   1. OK3D_SPREADSHEET_ID environment variable  (local overrides)
#   2. spreadsheet_id in Streamlit secrets       (Cloud, when the paste survives)
#   3. spreadsheet_id here                       (reliable fallback)
# ---------------------------------------------------------------------------

[ok3d]
spreadsheet_id = "1BIizam6JvfXW1YX6sxJS5pB4aKBj77Vdn09uvKmjMcg"
