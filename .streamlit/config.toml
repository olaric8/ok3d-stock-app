# ---------------------------------------------------------------------------
# Streamlit configuration for the OK3D Stock App.
#
# Committed on purpose: it carries the branding and turns off anonymous usage
# telemetry. It contains no secrets -- those go in the Streamlit Cloud secrets
# manager (see .streamlit/secrets.toml.example).
# ---------------------------------------------------------------------------

[theme]
primaryColor = "#12704F"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F4F6F5"
textColor = "#0B3D2E"

[browser]
# No usage statistics from a shop's own deployment.
gatherUsageStats = false

[server]
# The cloud supplies its own port; this only affects local runs.
headless = false
